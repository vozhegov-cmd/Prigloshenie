<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: #6e5d4f;
            background-color: #f9f6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Основная карточка с вашим фоном без надписей */
        .card {
            background: url('invitation_bg.jpg') no-repeat center top / cover;
            max-width: 450px;
            width: 100%;
            min-height: 820px;
            padding: 30px 20px 25px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(110, 93, 79, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Верхняя текстовая карточка */
        .header-section {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(3px);
            padding: 20px 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .title-wedding {
            font-family: 'Alex Brush', cursive;
            color: #8a7565;
            font-size: 3.6em;
            line-height: 1;
            margin-bottom: 6px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 0.7em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #9c8a7b;
            margin-bottom: 22px;
            font-weight: 500;
        }

        /* Информация о ЗАГСе и ресторане */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            align-items: center;
            gap: 10px;
        }

        .details-col h3 {
            font-size: 0.75em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7a6859;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .details-col p {
            font-size: 0.88em;
            color: #6e5d4f;
            line-height: 1.4;
            font-weight: 400;
        }

        .divider {
            background-color: #c4b5a5;
            height: 38px;
            width: 100%;
            opacity: 0.7;
        }

        /* Блок с именами ЛЕРА и ЖЕНЯ */
.names-overlay {
    position: absolute;
    top: 425px; /* Высота надписей */
    left: 50%;
    transform: translateX(-50%);
    width: 75%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
}

.names-overlay span {
    font-size: 0.9em;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #5c4333;
    font-weight: 500;
    text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    position: relative; /* Включает точную настройку сдвига */
}

/* Сдвиг имени ЛЕРА правее */
.name-lera {
    left: 35px; /* Увеличивайте это значение (20px, 25px и т.д.), чтобы двигать ещё правее */
}

/* Если нужно будет сдвинуть ЖЕНЯ */
.name-zhenya {
    right: 0px; 
}

        /* Кнопка и интерактивный блок ответа */
        .actions-section {
            margin-top: auto;
            padding-top: 20px;
        }

        .btn {
            background-color: #a39081;
            color: #ffffff;
            border: none;
            padding: 13px 26px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(163, 144, 129, 0.25);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #8a7565;
        }

        #rsvp-section {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: rgba(253, 251, 248, 0.96);
            border-radius: 15px;
            border: 1px solid #f0e8df;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.78em;
            margin-bottom: 6px;
            color: #7a6859;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #dcd2c7;
            border-radius: 8px;
            background: #ffffff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88em;
            color: #6e5d4f;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85em;
            color: #6e5d4f;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        input[type="radio"] {
            accent-color: #a39081;
        }

        #confirmation-message {
            display: none;
            color: #6b8260;
            font-weight: 500;
            font-size: 0.88em;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Текстовый блок сверху -->
        <div class="header-section">
            <h1 class="title-wedding">Wedding</h1>
            <p class="subtitle">Приглашаем вас на нашу свадьбу</p>
            
            <div class="details-grid">
                <div class="details-col">
                    <h3>Роспись в ЗАГСе</h3>
                    <p><b>29.01.2027</b><br>15:00<br><small>ул. Владимирская, 23</small></p>
                </div>
                <div class="divider"></div>
                <div class="details-col">
                    <h3>Ресторан</h3>
                    <p><b>"Апельсинка"</b><br>17:00<br><small>ул. Кольцова, 3</small></p>
                </div>
            </div>
        </div>

        <!-- Имена над фото детей -->
        <div class="names-overlay">
            <span>ЛЕРА</span>
            <span>ЖЕНЯ</span>
        </div>

        <!-- Форма ответа и кнопка -->
        <div class="actions-section">
            <button class="btn" id="open-btn" type="button" onclick="showRSVP()">Подтвердить присутствие</button>

            <div id="rsvp-section">
                <form id="rsvp-form" action="https://formspree.io/f/xeaqegav" method="POST" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="guest-name">ВАШЕ ИМЯ И ФАМИЛИЯ:</label>
                        <input type="text" id="guest-name" name="Имя гостя" placeholder="Иван Иванов" required>
                    </div>

                    <div class="form-group">
                        <label>СМОЖЕТЕ ЛИ ПРИДТИ?</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="Присутствие" value="Да, с удовольствием" required> С удовольствием приду
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="Присутствие" value="К сожалению, не смогу"> К сожалению, не смогу
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn" style="width: 100%;">Отправить</button>
                </form>
                
                <div id="confirmation-message">
                    Спасибо! Ваш ответ успешно получен.
                </div>
            </div>
        </div>
    </div>

    <script>
        function showRSVP() {
            document.getElementById('open-btn').style.display = 'none';
            document.getElementById('rsvp-section').style.display = 'block';
        }

        function submitForm(event) {
            event.preventDefault();
            const form = event.target;
            const data = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('rsvp-form').style.display = 'none';
                    document.getElementById('confirmation-message').style.display = 'block';
                } else {
                    alert('Ошибка отправки. Попробуйте ещё раз.');
                }
            }).catch(() => {
                alert('Ошибка отправки. Попробуйте ещё раз.');
            });
        }
    </script>

</body>
</html>
