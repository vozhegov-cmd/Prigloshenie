<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на свадьбу</title>
    <!-- Элегантные свадебные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: 'Cormorant Garamond', serif;
            color: #4a403a;
            /* Теплый, спокойный благородный фон */
            background-color: #f7f4f0;
            /* Легкий едва заметный кружевной микроузор */
            background-image: 
                radial-gradient(rgba(215, 204, 196, 0.4) 1px, transparent 0),
                radial-gradient(rgba(215, 204, 196, 0.4) 1px, #f7f4f0 0);
            background-size: 24px 24px;
            background-position: 0 0, 12px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Главная карточка */
        .card {
            background: #ffffff;
            max-width: 540px;
            width: 100%;
            padding: 55px 40px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(74, 64, 58, 0.06);

            /* Кружевная ажурная рамка по бокам и периметру */
            border: 20px solid transparent;
            border-image: repeating-radial-gradient(circle at 10px 10px, #ffffff, #ffffff 6px, #e8dfd8 7px, #ffffff 9px) 20;
            outline: 1px solid rgba(215, 204, 196, 0.5);
            outline-offset: -10px;
        }

        /* Заголовки */
        h1 {
            font-family: 'Alex Brush', cursive;
            color: #8c7365;
            font-size: 3.8em;
            margin: 0 0 10px 0;
            font-weight: normal;
        }

        h2 {
            font-family: 'Alex Brush', cursive;
            color: #8c7365;
            font-size: 2.8em;
            margin: 0 0 15px 0;
            font-weight: normal;
        }

        p {
            font-size: 1.2em;
            line-height: 1.7;
            letter-spacing: 0.02em;
        }

        .subtitle {
            font-style: italic;
            color: #7a6c63;
            margin-bottom: 30px;
        }

        /* Блок с информацией о мероприятии */
        .event-details {
            margin: 30px 0;
            padding: 25px 20px;
            background: #faf7f5;
            border-radius: 12px;
            border-top: 1px solid #e8dfd8;
            border-bottom: 1px solid #e8dfd8;
        }

        .event-details p {
            margin: 10px 0;
            font-size: 1.15em;
        }

        .highlight {
            font-weight: 600;
            color: #6b5548;
            letter-spacing: 0.05em;
        }

        /* Кнопка */
        .btn {
            background-color: #8c7365;
            color: #ffffff;
            border: none;
            padding: 14px 36px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15em;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #6b5548;
            box-shadow: 0 4px 12px rgba(107, 85, 72, 0.2);
        }

        /* Форма RSVP */
        #rsvp-section {
            display: none;
            margin-top: 35px;
            padding-top: 30px;
            border-top: 1px solid #e8dfd8;
            animation: fadeIn 0.6s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.05em;
            color: #5a4f47;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d7ccc4;
            border-radius: 6px;
            font-size: 1.05em;
            font-family: 'Cormorant Garamond', serif;
            background-color: #faf7f5;
            color: #4a403a;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #8c7365;
            background-color: #ffffff;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 1.05em;
        }

        input[type="radio"] {
            accent-color: #8c7365;
        }

        #confirmation-message {
            display: none;
            margin-top: 20px;
            color: #5b7052;
            font-weight: 600;
            font-size: 1.15em;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Текст приглашения -->
        <div id="invitation-text">
            <h1>Приглашение на Свадьбу</h1>
            <p class="subtitle">Дорогие и близкие! Мы будем счастливы разделить с вами этот день!</p>
            
            <div class="event-details">
                <p>📅 <span class="highlight">29 ЯНВАРЯ 2027 ГОДА</span></p>
                <p>💍 <span class="highlight">15:00</span> — Торжественная регистрация в ЗАГСе<br>
                <small style="color: #7a6c63;">(ул. Владимирская, д. 23)</small></p>
                <p>🎉 <span class="highlight">17:00</span> — Праздничный банкет<br>
                <small style="color: #7a6c63;">(ул. Кольцова, д. 3)</small></p>
            </div>

            <button class="btn" type="button" onclick="showRSVP()">Подтвердить присутствие</button>
        </div>

        <!-- Форма ответа -->
        <div id="rsvp-section">
            <h2>Ваш ответ</h2>
            <form id="rsvp-form" action="https://formspree.io/f/xeaqegav" method="POST" onsubmit="submitForm(event)">
                <div class="form-group">
                    <label for="guest-name">Ваше имя и фамилия:</label>
                    <input type="text" id="guest-name" name="Имя гостя" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label>Планируете ли присутствовать?</label>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" name="Присутствие" value="Да, с удовольствием" required> С удовольствием приду
                        </label>
                        <label class="radio-option">
                            <input type="radio" name="Присутствие" value="К сожалению, не смогу"> К сожалению, не смогу быть
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn">Отправить</button>
            </form>
            
            <div id="confirmation-message">
                Спасибо! Ваш ответ успешно получен.
            </div>
        </div>
    </div>

    <script>
        function showRSVP() {
            const rsvpSection = document.getElementById('rsvp-section');
            rsvpSection.style.display = 'block';
            rsvpSection.scrollIntoView({ behavior: 'smooth' });
        }

        function submitForm(event) {
            event.preventDefault();
            const form = event.target;
            const data = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    document.getElementById('rsvp-form').style.display = 'none';
                    document.getElementById('confirmation-message').style.display = 'block';
                } else {
                    alert('Ошибка при отправке. Попробуйте ещё раз.');
                }
            }).catch(() => {
                alert('Ошибка при отправке. Попробуйте ещё раз.');
            });
        }
    </script>

</body>
</html>
